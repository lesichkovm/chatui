<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatUI Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ChatUI',
      repo: 'https://github.com/lesichkovm/chatui',
      loadSidebar: true,
      auto2top: true,
      search: 'auto',
      maxLevel: 4,
      subMaxLevel: 2,
      mermaidConfig: {
        theme: 'dark',
        themeVariables: {
          primaryColor: '#42b883',
          primaryTextColor: '#fff',
          primaryBorderColor: '#42b883',
          lineColor: '#42b883',
          secondaryColor: '#f4f4f4',
          tertiaryColor: '#f4f4f4'
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            // Initialize Mermaid after each page load
            if (window.mermaid) {
              window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                themeVariables: {
                  primaryColor: '#42b883',
                  primaryTextColor: '#fff',
                  primaryBorderColor: '#42b883',
                  lineColor: '#42b883',
                  secondaryColor: '#f4f4f4',
                  tertiaryColor: '#f4f4f4'
                }
              });
              window.mermaid.init();
            }
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</body>
</html>
