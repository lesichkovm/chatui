<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Chat</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #007bff;
            color: white;
            padding: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
        #chat-container {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* Beta Banner */
        .corner-ribbon-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            overflow: hidden;
            z-index: 10000;
            pointer-events: none;
        }

        .corner-ribbon {
            position: absolute;
            top: 15px;
            left: -40px;
            width: 150px;
            background: #9bc90d;
            background: linear-gradient(to bottom, #9bc90d 0%, #79a70a 100%);
            color: #fff;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 13px;
            line-height: 30px;
            transform: rotate(-45deg);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="corner-ribbon-wrapper">
        <div class="corner-ribbon">BETA</div>
    </div>
    <div class="header">
        <h1>Chat Interface</h1>
    </div>
    
    <div id="chat-container"></div>

    <!-- Chat Widget Script with fullpage mode -->
    <script 
        id="chat-widget"
        src="../dist/chat-widget.js"
        data-target="#chat-container"
        data-server-url="/demo/full_page/api"
        data-display="fullpage"
        data-color="#007bff"
        data-title="Chat with us">
    </script>
</body>
</html>
