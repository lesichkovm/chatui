<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Test</title>
    <style>
        /* Beta Banner */
        .corner-ribbon-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            overflow: hidden;
            z-index: 10000;
            pointer-events: none;
        }

        .corner-ribbon {
            position: absolute;
            top: 15px;
            left: -40px;
            width: 150px;
            background: #9bc90d;
            background: linear-gradient(to bottom, #9bc90d 0%, #79a70a 100%);
            color: #fff;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 13px;
            line-height: 30px;
            transform: rotate(-45deg);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="corner-ribbon-wrapper">
        <div class="corner-ribbon">BETA</div>
    </div>
    <h1>Widget Test</h1>
    <p>Type "test" to see widget functionality.</p>
    
    <script>
        // Mock the API for testing
        const originalFetch = window.fetch;
        
        // Test widget functionality
        window.addEventListener('load', () => {
            console.log('Testing widget functionality...');
            
            // Wait for widget to initialize
            setTimeout(() => {
                // Test if widget was created
                const widget = document.querySelector('[id^="chat-widget-"]');
                if (widget) {
                    console.log('✓ Widget created successfully');
                } else {
                    console.log('✗ Widget not found');
                }
            }, 1000);
        });
    </script>
    
    <script 
        id="chat-widget"
        src="../dist/chat-widget.js"
        data-server-url="/.netlify/functions/chat-api"
        data-position="bottom-right"
        data-color="#007bff"
        data-title="Test Widget">
    </script>
</body>
</html>
